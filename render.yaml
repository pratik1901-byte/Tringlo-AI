# ============================================================
# Render blueprint — a stable public host for Tringlo AI
# ============================================================
# One always-on web service (a persistent container, NOT serverless) with a
# persistent disk for the database. numInstances is pinned to 1 on purpose: the
# process owns the JSON database cache, so the service must never scale out.
#
# After deploy, set the env vars marked `sync: false` in the Render dashboard
# (never commit them). WEBHOOK_BASE_URL is the service's own https URL — this is
# the stable address Sarvam's tool calls, inbound and outbound webhooks all use.
# ============================================================
services:
  - type: web
    name: tringlo
    runtime: docker
    plan: starter
    numInstances: 1
    healthCheckPath: /api/webhooks/sarvam/outbound
    disk:
      name: tringlo-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      # The stable public https URL of THIS service (e.g. https://tringlo.onrender.com).
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      # Sarvam — set in the dashboard, never in Git.
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_ORG_ID
        sync: false
      - key: SARVAM_WORKSPACE_ID
        sync: false
      - key: SARVAM_APP_ID
        sync: false
      - key: SARVAM_APP_VERSION
        sync: false
      - key: SARVAM_INBOUND_APP_VERSION
        sync: false
      - key: SARVAM_APP_TYPE
        sync: false
      - key: SARVAM_CONNECTION_ID
        sync: false
      - key: SARVAM_AGENT_PHONE_NUMBER
        sync: false
      # Email (optional).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Demo/hospital flags (safe to set; see .env.local comments).
      - key: TRINGLO_HOSPITAL_WORKSPACES
        sync: false
      - key: TRINGLO_HOSPITAL_AGENT_NAME
        sync: false
      - key: TRINGLO_CALLER_NAME_WORKSPACES
        sync: false
