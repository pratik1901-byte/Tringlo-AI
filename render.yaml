# ============================================================
# Render blueprint — Tringlo AI on the FREE plan
# ============================================================
# Free web services have NO persistent disk and spin down after ~15 min idle,
# so the database is NOT kept on the local file here. Instead it is mirrored to
# a free external store. Set ONE of:
#   - DATABASE_URL (a free Neon Postgres connection string)  [recommended]
#   - TRINGLO_DB_REST_URL + TRINGLO_DB_REST_TOKEN (Upstash Redis / Vercel KV)
# With one set, data survives restarts and redeploys. Without any, the app would
# lose all data on every spin-down, so DO NOT deploy free without configuring one.
#
# Caveats of the free plan (unavoidable, not bugs): the service sleeps after
# ~15 min of inactivity, so the first request after idle cold-starts (slow) and
# the in-process scheduler pauses while asleep. A free uptime pinger hitting the
# health path keeps it warm.
#
# Set every env var marked `sync: false` in the Render dashboard; never commit
# secrets. WEBHOOK_BASE_URL is this service's own https URL.
# ============================================================
services:
  - type: web
    name: tringlo
    runtime: docker
    plan: free
    numInstances: 1
    healthCheckPath: /api/webhooks/sarvam/outbound
    envVars:
      # The stable public https URL of THIS service (e.g. https://tringlo.onrender.com).
      - key: WEBHOOK_BASE_URL
        sync: false
      - key: NODE_ENV
        value: production
      # External database (free, persistent) — REQUIRED on the free plan.
      # Recommended: a free Neon Postgres connection string.
      - key: DATABASE_URL
        sync: false
      # Alternative to DATABASE_URL: an Upstash Redis / Vercel KV REST store.
      - key: TRINGLO_DB_REST_URL
        sync: false
      - key: TRINGLO_DB_REST_TOKEN
        sync: false
      # Object storage (S3-compatible, e.g. Neon Object Storage) for call
      # recordings — so they survive the disk-less free host. Optional.
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_REGION
        sync: false
      - key: TRINGLO_S3_BUCKET
        sync: false
      # Sarvam — set in the dashboard, never in Git.
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_ORG_ID
        sync: false
      - key: SARVAM_WORKSPACE_ID
        sync: false
      - key: SARVAM_APP_ID
        sync: false
      - key: SARVAM_APP_VERSION
        sync: false
      - key: SARVAM_INBOUND_APP_VERSION
        sync: false
      - key: SARVAM_APP_TYPE
        sync: false
      - key: SARVAM_CONNECTION_ID
        sync: false
      - key: SARVAM_AGENT_PHONE_NUMBER
        sync: false
      # Email (optional).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: MAIL_FROM
        sync: false
      # Demo/hospital flags (safe to set; see .env.local comments).
      - key: TRINGLO_HOSPITAL_WORKSPACES
        sync: false
      - key: TRINGLO_HOSPITAL_AGENT_NAME
        sync: false
      - key: TRINGLO_CALLER_NAME_WORKSPACES
        sync: false
